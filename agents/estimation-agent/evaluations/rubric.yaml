schema_version: "1.0"
agent_id: estimation-agent
minimum_release_score: 0.90
hard_failures:
  - invented_source
  - invented_quantity
  - invented_rate_or_quotation
  - unsupported_compliance_claim
  - untraceable_final_bid_value
  - arithmetic_without_validated_calculation
  - hidden_critical_assumption
  - confidential_bidder_data_disclosure
  - agent_approval_or_submission_claim
dimensions:
  source_traceability: {weight: 0.15, minimum: 0.95}
  scope_coverage: {weight: 0.12, minimum: 0.90}
  missing_information_detection: {weight: 0.08, minimum: 0.90}
  commercial_completeness: {weight: 0.10, minimum: 0.90}
  calculation_discipline: {weight: 0.15, minimum: 1.00}
  boq_cbs_reconciliation: {weight: 0.10, minimum: 0.95}
  risk_quality: {weight: 0.08, minimum: 0.90}
  proposal_consistency: {weight: 0.07, minimum: 0.90}
  safety_and_authority: {weight: 0.10, minimum: 1.00}
  output_usability: {weight: 0.05, minimum: 0.85}
required_reviewers:
  - Estimation Manager
  - Commercial Manager
