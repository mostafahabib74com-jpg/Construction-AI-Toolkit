schema_version: "1.0"
workflow:
  id: quotation-comparison
  title: "Quotation Comparison"
  version: 0.1.0
  status: specification
  objective: "Normalize and compare subcontractor and supplier offers on a common technical-commercial basis."
  prompt: ../../prompts/quotation-comparison/prompt.md
  prerequisites:
    - "scope-extraction"
    - "boq-development"
  required_inputs:
    - "rfq_package"
    - "quotation_register"
    - "quotation_documents"
    - "normalization_profiles"
    - "required_delivery_and_terms"
  deliverables:
    - "quotation_register"
    - "technical_compliance_matrix"
    - "commercial_normalization_matrix"
    - "scope_gap_matrix"
    - "evaluated_price_bridge"
    - "bid_spread_analysis"
    - "clarification_register"
    - "recommendation"
  required_reviewers:
    - "Estimation Manager"
    - "Procurement Manager"
    - "Technical Manager"
    - "Commercial Manager"
  required_tool_categories:
    - "document_parser"
    - "spreadsheet_parser"
    - "currency_engine"
    - "unit_normalizer"
    - "quotation_comparator"
  completion_gates:
    - source_traceability_complete
    - deterministic_calculations_valid
    - assumptions_and_exclusions_visible
    - output_schema_valid
    - reconciliation_complete
    - professional_review_recorded
  blocking_conditions:
    - "missing_rfq_basis"
    - "incomparable_critical_scope"
    - "unapproved_exchange_or_tax_basis"
    - "confidentiality_violation"
  authority:
    may_draft: true
    may_calculate_with_validated_tools: true
    may_approve: false
    may_issue_externally: false
    may_submit_bid: false
