schema_version: "1.0"
workflow:
  id: time-impact-analysis
  title: "Time Impact Analysis"
  version: 0.1.0
  status: specification
  objective: "Create and test a traceable fragnet against the correct contemporaneous schedule, reporting modeled time effect without deciding entitlement."
  prompt: ../../prompts/time-impact-analysis/prompt.md
  prerequisites:
    - "progress-update"
    - "delay-analysis"
  required_inputs:
    - "accepted_schedule_model"
    - "contemporaneous_update"
    - "delay_event_and_fragnet_basis"
    - "analysis_date"
    - "contract_rules"
  deliverables:
    - "unimpacted_schedule_model"
    - "fragnet_register"
    - "impacted_schedule_model"
    - "impact_comparison"
    - "time_impact_analysis_report"
    - "sensitivity_results"
  required_reviewers:
    - "Planning Manager"
    - "Project Controls Manager"
    - "Contract or Claims Manager"
  required_tool_categories:
    - "cpm_engine"
    - "fragnet_engine"
    - "schedule_comparison_engine"
    - "schedule_validator"
  completion_gates:
    - source_traceability_complete
    - schedule_version_and_data_date_recorded
    - deterministic_calculations_valid
    - data_quality_checks_complete
    - output_schema_valid
    - professional_review_recorded
  blocking_conditions:
    - "missing_accepted_schedule_model"
    - "missing_contemporaneous_update"
    - "unsupported_fragnet_logic"
    - "impact_model_validation_failure"
  authority:
    may_draft: true
    may_calculate_with_validated_tools: true
    may_approve: false
    may_modify_source_schedule: false
    may_publish_to_p6: false
