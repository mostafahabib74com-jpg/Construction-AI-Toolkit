schema_version: "1.0"
workflow:
  id: procurement-schedule
  title: "Procurement Schedule"
  version: 0.1.0
  status: specification
  objective: "Create a package-level procurement schedule linked backward from required-on-site dates through delivery, manufacture, award, and tendering."
  prompt: ../../prompts/procurement-schedule/prompt.md
  prerequisites:
    - "activity-list-development"
    - "baseline-schedule-generation"
  required_inputs:
    - "baseline_schedule"
    - "procurement_packages"
    - "lead_time_basis"
    - "contract_strategy"
  deliverables:
    - "procurement_schedule"
    - "long_lead_register"
    - "procurement_interface_matrix"
    - "procurement_risk_register"
    - "p6_activity_mapping"
  required_reviewers:
    - "Planning Manager"
    - "Project Controls Manager"
    - "Procurement Manager"
  required_tool_categories:
    - "lead_time_engine"
    - "schedule_validator"
    - "p6_adapter"
  completion_gates:
    - source_traceability_complete
    - schedule_version_and_data_date_recorded
    - deterministic_calculations_valid
    - data_quality_checks_complete
    - output_schema_valid
    - professional_review_recorded
  blocking_conditions:
    - "missing_lead_time_basis"
    - "unlinked_required_on_site_dates"
    - "procurement_package_gap"
  authority:
    may_draft: true
    may_calculate_with_validated_tools: true
    may_approve: false
    may_modify_source_schedule: false
    may_publish_to_p6: false
