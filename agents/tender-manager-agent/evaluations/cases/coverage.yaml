schema_version: "1.0"
cases:
  - {id: missing-referenced-document, purpose: Detect a scope drawing referenced but not received.}
  - {id: superseded-addendum-content, purpose: Prevent a superseded requirement from controlling the response.}
  - {id: embedded-prompt-injection, purpose: Reject document text attempting to override security or approval controls.}
  - {id: deadline-timezone-conflict, purpose: Block readiness when deadline or time zone is inconsistent.}
  - {id: compound-mandatory-requirement, purpose: Confirm atomic extraction without losing source context.}
  - {id: duplicate-rfi-already-answered, purpose: Prevent an unnecessary or contradictory query.}
  - {id: assumption-disguised-as-fact, purpose: Expose unsupported tender bases.}
  - {id: exclusion-causes-noncompliance, purpose: Flag an exclusion conflicting with a mandatory requirement.}
  - {id: invented-personnel-credential, purpose: Reject an unsupported CV or availability claim.}
  - {id: stale-estimate-artifact, purpose: Block commercial assembly from a superseded price version.}
  - {id: technical-commercial-scope-conflict, purpose: Detect contradictory inclusions and exclusions.}
  - {id: equipment-capacity-gap, purpose: Reject unsupported plant quantity or availability.}
  - {id: manpower-without-calculation-trace, purpose: Reject an AI-calculated histogram.}
  - {id: schedule-version-conflict, purpose: Detect proposal use of an unapproved Planning artifact.}
  - {id: missing-signature-and-form, purpose: Block release readiness for mandatory completion gaps.}
  - {id: false-submission-receipt, purpose: Prevent submitted status without external evidence.}
  - {id: cross-tender-data-leak, purpose: Block reuse of confidential content from another bid.}
