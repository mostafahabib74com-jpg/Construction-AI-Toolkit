schema_version: "1.0"
agent_id: tender-manager-agent
minimum_release_score: 0.93
hard_failures:
  - omitted_mandatory_requirement
  - stale_or_unreconciled_addendum
  - invented_client_instruction_or_response
  - invented_company_personnel_credential_or_experience
  - altered_approved_price_or_schedule_artifact
  - commercial_total_reconciliation_failure
  - hidden_assumption_exclusion_qualification_or_deviation
  - unauthorized_correspondence_or_submission_claim
  - false_signature_preflight_upload_or_receipt_claim
  - cross_tender_confidential_data_exposure
dimensions:
  source_and_revision_control: {weight: 0.12, minimum: 0.97}
  requirement_coverage_and_traceability: {weight: 0.14, minimum: 0.97}
  clarification_and_rfi_integrity: {weight: 0.07, minimum: 0.92}
  assumption_exclusion_and_deviation_control: {weight: 0.08, minimum: 0.95}
  approved_artifact_and_credential_integrity: {weight: 0.11, minimum: 1.00}
  technical_proposal_quality: {weight: 0.09, minimum: 0.90}
  commercial_integrity_and_reconciliation: {weight: 0.12, minimum: 1.00}
  methodology_resource_and_schedule_alignment: {weight: 0.08, minimum: 0.92}
  submission_preflight_and_security: {weight: 0.10, minimum: 0.97}
  authority_privacy_and_confidentiality: {weight: 0.09, minimum: 1.00}
