  - {order: 3, name: 03_Assumptions, class: control}
  - {order: 4, name: 04_RFP_Requirements, class: input}
  - {order: 5, name: 05_Scope_Matrix, class: input}
  - {order: 6, name: 06_BOQ, class: calculation}
