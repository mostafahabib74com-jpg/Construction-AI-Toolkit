schema_version: "1.0"
workflow:
  id: pricing-risk-assessment
  title: "Pricing Risk Assessment"
  version: 0.1.0
  status: specification
  objective: "Assess threats and opportunities, define pricing treatment, and prevent double counting."
  prompt: ../../prompts/pricing-risk-assessment/prompt.md
  prerequisites:
    - "rfp-analysis"
    - "scope-extraction"
    - "information-gap-analysis"
    - "boq-development"
    - "cbs-development"
  required_inputs:
    - "approved_estimate_basis"
    - "scope_and_gap_registers"
    - "quotation_and_market_data"
    - "contract_and_commercial_profiles"
    - "risk_appetite"
  deliverables:
    - "pricing_risk_register"
    - "risk_heat_map"
    - "exposure_analysis"
    - "pricing_treatment_matrix"
    - "contingency_recommendation"
    - "scenario_report"
    - "executive_decisions"
  required_reviewers:
    - "Estimation Manager"
    - "Commercial Manager"
    - "Executive Bid Sponsor"
  required_tool_categories:
    - "risk_engine"
    - "scenario_engine"
    - "reconciliation_engine"
  completion_gates:
    - source_traceability_complete
    - deterministic_calculations_valid
    - assumptions_and_exclusions_visible
    - output_schema_valid
    - reconciliation_complete
    - professional_review_recorded
  blocking_conditions:
    - "missing_risk_appetite"
    - "unsupported_impact_ranges"
    - "double_counted_allowance"
    - "unapproved_residual_critical_risk"
  authority:
    may_draft: true
    may_calculate_with_validated_tools: true
    may_approve: false
    may_issue_externally: false
    may_submit_bid: false
