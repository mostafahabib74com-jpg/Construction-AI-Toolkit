[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-ai-orchestrator"
version = "0.1.0"
description = "Provider-neutral control plane for Construction AI Toolkit agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.23.0",
  "PyYAML==6.0.2"
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
construction-ai = "construction_ai_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["../../tests"]
