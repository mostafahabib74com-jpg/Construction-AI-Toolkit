schema_version: "1.0"
workflow:
  id: wbs-development
  title: "WBS Development"
  version: 0.1.0
  status: specification
  objective: "Create a complete, coded, scope-covering WBS with defined control accounts and ownership boundaries."
  prompt: ../../prompts/wbs-development/prompt.md
  prerequisites:
    []
  required_inputs:
    - "contract_scope"
    - "project_breakdown_requirements"
    - "milestone_register"
    - "coding_rules"
  deliverables:
    - "complete_wbs"
    - "wbs_dictionary"
    - "coding_structure"
    - "scope_coverage_matrix"
    - "wbs_exception_register"
  required_reviewers:
    - "Planning Manager"
    - "Project Controls Manager"
    - "Construction Manager"
  required_tool_categories:
    - "document_parser"
    - "taxonomy_engine"
    - "schedule_validator"
  completion_gates:
    - source_traceability_complete
    - schedule_version_and_data_date_recorded
    - deterministic_calculations_valid
    - data_quality_checks_complete
    - output_schema_valid
    - professional_review_recorded
  blocking_conditions:
    - "missing_scope_basis"
    - "unresolved_scope_ownership"
    - "wbs_code_collision"
  authority:
    may_draft: true
    may_calculate_with_validated_tools: true
    may_approve: false
    may_modify_source_schedule: false
    may_publish_to_p6: false
