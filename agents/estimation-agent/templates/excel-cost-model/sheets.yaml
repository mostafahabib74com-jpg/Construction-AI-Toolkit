  - {order: 11, name: 11_Subcontract_Quotes, class: calculation}
  - {order: 12, name: 12_Rate_Buildups, class: calculation}
  - {order: 13, name: 13_Direct_Costs, class: calculation}
  - {order: 14, name: 14_Preliminaries, class: calculation}
  - {order: 15, name: 15_Procurement_Logistics, class: calculation}
