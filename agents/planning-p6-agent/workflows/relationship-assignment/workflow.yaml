schema_version: "1.0"
workflow:
  id: relationship-assignment
  title: "Relationship Assignment"
  version: 0.1.0
  status: specification
  objective: "Create constructible, traceable CPM logic with justified relationship types, lags, constraints, and interface dependencies."
  prompt: ../../prompts/relationship-assignment/prompt.md
  prerequisites:
    - "activity-list-development"
    - "calendar-assignment"
  required_inputs:
    - "activity_register"
    - "calendar_register"
    - "construction_methodology"
    - "interface_register"
  deliverables:
    - "relationship_register"
    - "open_end_report"
    - "constraint_and_lag_register"
    - "logic_quality_report"
  required_reviewers:
    - "Planning Manager"
    - "Project Controls Manager"
    - "Construction Manager"
  required_tool_categories:
    - "cpm_engine"
    - "logic_validator"
    - "schedule_validator"
  completion_gates:
    - source_traceability_complete
    - schedule_version_and_data_date_recorded
    - deterministic_calculations_valid
    - data_quality_checks_complete
    - output_schema_valid
    - professional_review_recorded
  blocking_conditions:
    - "missing_activity_ids"
    - "circular_logic"
    - "unsupported_lag_or_constraint"
  authority:
    may_draft: true
    may_calculate_with_validated_tools: true
    may_approve: false
    may_modify_source_schedule: false
    may_publish_to_p6: false
