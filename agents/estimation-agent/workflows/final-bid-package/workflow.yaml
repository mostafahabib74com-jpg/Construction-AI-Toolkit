schema_version: "1.0"
workflow:
  id: final-bid-package
  title: "Final Bid Package"
  version: 0.1.0
  status: specification
  objective: "Assemble and validate the final controlled bid package without submitting it."
  prompt: ../../prompts/final-bid-package/prompt.md
  prerequisites:
    - "rfp-analysis"
    - "scope-extraction"
    - "boq-development"
    - "cbs-development"
    - "excel-cost-model"
    - "pricing-risk-assessment"
    - "commercial-proposal"
  required_inputs:
    - "latest_rfp_register"
    - "approved_workflow_outputs"
    - "technical_and_commercial_artifacts"
    - "corporate_submission_documents"
    - "bid_freeze_metadata"
  deliverables:
    - "bid_package_manifest"
    - "final_compliance_matrix"
    - "price_reconciliation"
    - "consistency_report"
    - "open_item_register"
    - "submission_checklist"
    - "executive_decision_page"
    - "readiness_status"
  required_reviewers:
    - "Estimation Manager"
    - "Tender Manager"
    - "Commercial Manager"
    - "Executive Bid Sponsor"
  required_tool_categories:
    - "document_validator"
    - "reconciliation_engine"
    - "manifest_generator"
    - "checksum_tool"
    - "package_validator"
  completion_gates:
    - source_traceability_complete
    - deterministic_calculations_valid
    - assumptions_and_exclusions_visible
    - output_schema_valid
    - reconciliation_complete
    - professional_review_recorded
  blocking_conditions:
    - "missing_mandatory_file"
    - "superseded_file_in_package"
    - "price_reconciliation_failure"
    - "critical_open_item"
    - "missing_authorized_approval"
  authority:
    may_draft: true
    may_calculate_with_validated_tools: true
    may_approve: false
    may_issue_externally: false
    may_submit_bid: false
